apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_argocd_image_updater: "true"
  template:
    metadata:
      name: argocd-image-updater-{{name}}
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: addons
      source:
        repoURL: https://argoproj.github.io/argo-helm
        chart: argocd-image-updater
        targetRevision: 0.11.2
        helm:
          releaseName: argocd-image-updater
          values: |
            config:
              registries:
                - name: ECR
                  api_url: https://{{metadata.annotations.aws_account_id}}.dkr.ecr.{{metadata.annotations.aws_region}}.amazonaws.com
                  prefix: {{metadata.annotations.aws_account_id}}.dkr.ecr.{{metadata.annotations.aws_region}}.amazonaws.com
                  ping: true
                  insecure: false
                  credentials: ext:/scripts/ecr-login.sh
                  credsexpire: 10h
              argocd:
                grpcWeb: true
                serverAddress: argocd-server.argocd.svc.cluster.local
                insecure: true
                plaintext: true
            extraObjects:
              - apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: argocd-image-updater-scripts
                data:
                  ecr-login.sh: |
                    #!/bin/sh
                    aws ecr --region "${AWS_REGION}" get-authorization-token \
                      --output text --query 'authorizationData[].authorizationToken' \
                      | base64 -d
      destination:
        server: '{{server}}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
